name: All-sources discovery (unified orchestrator)

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources; structured options include finep,fbds,dopa,canoas,ibama,tnc,funbio"
        required: false
        default: "bndes,brde,fapergs,funbio,iis_rio,sema_rs,tnc,wwf"
        type: string
      audit_only:
        description: "Discover and upload fidelity artifacts without OCR or submission"
        required: true
        default: true
        type: boolean
      opportunity_sources:
        description: "Sources allowed to use the structured opportunity submission contract"
        required: false
        default: ""
        type: string
      filter_policy:
        description: "Filter policy forwarded to BS4 discoverers (default|include_tdr|no_prefilter)"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - include_tdr
          - no_prefilter
      min_notice_year:
        description: "Minimum notice year forwarded to BS4 discoverers (plan §9 year guard)"
        required: false
        default: "2026"
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-trigger
  cancel-in-progress: false

jobs:
  discover-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCOVERY_SOURCES: ${{ inputs.sources || 'bndes,brde,fapergs,funbio,iis_rio,sema_rs,tnc,wwf' }}
      DISCOVERY_FILTER_POLICY: ${{ inputs.filter_policy || 'default' }}
      DISCOVERY_MIN_NOTICE_YEAR: ${{ inputs.min_notice_year || '2026' }}
      DISCOVERY_AUDIT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_only }}
      OPPORTUNITY_SOURCES: ${{ inputs.opportunity_sources || vars.OPPORTUNITY_SOURCES || '' }}
    steps:
      - name: Checkout scheduler repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ocr-worker.txt

      - name: Install OCR worker dependencies
        run: pip install -r requirements-ocr-worker.txt

      - name: Install Playwright Chromium for browser-backed sources
        if: ${{ contains(format(',{0},', env.DISCOVERY_SOURCES), ',fao,') || contains(format(',{0},', env.DISCOVERY_SOURCES), ',fundacao_grupo_boticario,') || contains(format(',{0},', env.DISCOVERY_SOURCES), ',kfw,') || contains(format(',{0},', env.DISCOVERY_SOURCES), ',msgov,') }}
        run: playwright install --with-deps chromium

      - name: Run unified discovery orchestrator
        run: python scripts/discover_all_candidates.py
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          SOURCE_RUN_REPORTING_ENABLED: ${{ vars.SOURCE_RUN_REPORTING_ENABLED || 'false' }}
          SOURCES: ${{ env.DISCOVERY_SOURCES }}
          FILTER_POLICY: ${{ env.DISCOVERY_FILTER_POLICY }}
          MIN_NOTICE_YEAR: ${{ env.DISCOVERY_MIN_NOTICE_YEAR }}
          SCRAPE_MAX_PDF_BYTES: "15000000"
          SCRAPE_MAX_PDFS_PER_RUN: "5"
          KREUZBERG_PADDLE_LANGUAGE: "latin"
          KREUZBERG_PADDLE_MODEL_TIER: "tiny"
          KREUZBERG_USE_GPU: "false"
          KREUZBERG_FORCE_OCR_DEFAULT: "false"
          KREUZBERG_EXTRACTION_TIMEOUT_SECONDS: "300"
          FLAGS_use_mkldnn: "0"
          PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "0"
          DISCOVERY_AUDIT_DIR: artifacts/source-audits
          FUNBIO_NEWS_ENABLED: "false"
          FINEP_MAX_OPPORTUNITIES_PER_RUN: "10"
          FBDS_MAX_DETAILS_PER_RUN: "20"

      - name: Verify source fidelity artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_only }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for source_dir in artifacts/source-audits/*; do
            [ -d "$source_dir" ] || continue
            found=1
            python scripts/audit_source_fidelity.py \
              --source-inventory "$source_dir/source_inventory.json" \
              --discovery "$source_dir/discovery.json" \
              --out "$source_dir/fidelity"
          done
          [ "$found" -eq 1 ]

      - name: Upload structured source audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structured-source-audits
          path: artifacts/source-audits
          if-no-files-found: ignore
