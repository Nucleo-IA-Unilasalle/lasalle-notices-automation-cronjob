name: Discovery group A (bndes, brde, fao, fapergs, govbr_mma_fnma, iis_rio, canoas)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-group-a
  queue: max
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      includes: ${{ steps.build.outputs.includes }}
      admitted: ${{ steps.build.outputs.admitted }}
    steps:
      - name: Checkout scheduler repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build strict source matrix from the registry
        id: build
        run: |
          includes="$(python scripts/build_source_matrix.py --group a --format github)"
          if [ "$includes" = "[]" ]; then
            echo 'includes=[{"source":"__closed_beta_denied__","browser_required":false,"rollout_mode":"audit","submission_contract":"candidate"}]' >> "$GITHUB_OUTPUT"
            echo 'admitted=false' >> "$GITHUB_OUTPUT"
          else
            echo "includes=$includes" >> "$GITHUB_OUTPUT"
            echo 'admitted=true' >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOSED_BETA_SOURCE_ALLOWLIST: ${{ vars.CLOSED_BETA_SOURCE_ALLOWLIST || '' }}

  discover:
    needs: matrix
    if: ${{ needs.matrix.outputs.admitted == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.includes) }}
    uses: ./.github/workflows/pipeline-discovery-source.yml
    with:
      source: ${{ matrix.source }}
      browser_required: ${{ matrix.browser_required && 'true' || 'false' }}
      rollout_mode: ${{ matrix.rollout_mode }}
      submission_contract: ${{ matrix.submission_contract }}
    secrets: inherit
