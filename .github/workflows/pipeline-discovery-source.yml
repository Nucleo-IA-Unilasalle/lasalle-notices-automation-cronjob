name: Single-source discovery (reusable)

on:
  workflow_call:
    inputs:
      source:
        description: "Single source key to discover"
        required: true
        type: string
      browser_required:
        description: "Whether Playwright Chromium must be installed for this source"
        required: true
        type: string
      rollout_mode:
        description: "audit runs discover and verify without ingestion"
        required: true
        type: string
      submission_contract:
        description: "candidate or opportunity"
        required: true
        type: string
      run_timeout_minutes:
        description: "Hard job timeout"
        required: false
        type: number
        default: 20
  workflow_dispatch:
    inputs:
      source:
        description: "Single source key to discover"
        required: true
        type: string
      browser_required:
        description: "Whether Playwright Chromium must be installed"
        required: true
        type: choice
        options:
          - "true"
          - "false"
      rollout_mode:
        description: "audit runs discover and verify without ingestion"
        required: true
        type: choice
        options:
          - audit
          - ingest
      submission_contract:
        description: "candidate or opportunity"
        required: true
        type: choice
        options:
          - candidate
          - opportunity

permissions:
  contents: read

concurrency:
  # Unique per run: real serialization is the per-source job-level lock below.
  # A shared group here would serialize every matrix job across all groups.
  group: discovery-source-run-${{ github.run_id }}-${{ inputs.source }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  discover-source:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.run_timeout_minutes || 20 }}
    # Per-source lock, independent of workflow/ref/run id. The scheduled group
    # writer and any manual fallback of the same source serialize here.
    concurrency:
      group: discovery-${{ inputs.source }}-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    env:
      DISCOVERY_SOURCE: ${{ inputs.source }}
      DISCOVERY_AUDIT_ONLY: ${{ inputs.rollout_mode == 'audit' && 'true' || 'false' }}
      SUBMISSION_CONTRACT: ${{ inputs.submission_contract }}
    steps:
      - name: Record job budget start
        run: echo "SOURCE_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout scheduler repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ocr-worker.txt

      - name: Install OCR worker dependencies
        run: pip install -r requirements-ocr-worker.txt

      - name: Install Playwright Chromium for browser-backed source
        if: ${{ inputs.browser_required == 'true' }}
        run: playwright install --with-deps chromium

      - name: Run single-source discovery orchestrator
        run: python scripts/run_managed_source.py --source "$DISCOVERY_SOURCE" scripts/discover_all_candidates.py
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          SOURCE_RUN_REPORTING_ENABLED: ${{ vars.SOURCE_RUN_REPORTING_ENABLED || 'false' }}
          SOURCES: ${{ env.DISCOVERY_SOURCE }}
          SOURCE_JOB_TIMEOUT_MINUTES: ${{ inputs.run_timeout_minutes || 20 }}
          SOURCE_APPLICATION_BUDGET_SECONDS: "1080"
          SUBMISSION_CONTRACT: ${{ env.SUBMISSION_CONTRACT }}
          OPPORTUNITY_SOURCES: ${{ vars.OPPORTUNITY_SOURCES || '' }}
          SOURCE_ROTATION_OFFSET: "0"
          FILTER_POLICY: "default"
          MIN_NOTICE_YEAR: "2026"
          SCRAPE_MAX_PDF_BYTES: "15000000"
          SCRAPE_MAX_PDFS_PER_RUN: "5"
          KREUZBERG_PADDLE_LANGUAGE: "latin"
          KREUZBERG_PADDLE_MODEL_TIER: "tiny"
          KREUZBERG_USE_GPU: "false"
          KREUZBERG_FORCE_OCR_DEFAULT: "false"
          KREUZBERG_EXTRACTION_TIMEOUT_SECONDS: "300"
          FLAGS_use_mkldnn: "0"
          PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "0"
          DISCOVERY_AUDIT_DIR: artifacts/source-audits/${{ env.DISCOVERY_SOURCE }}
          FUNBIO_NEWS_ENABLED: "false"
          FINEP_MAX_OPPORTUNITIES_PER_RUN: "10"
          FBDS_MAX_DETAILS_PER_RUN: "20"

      - name: Upload source audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-audit-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/source-audits
          if-no-files-found: ignore
          retention-days: 7
