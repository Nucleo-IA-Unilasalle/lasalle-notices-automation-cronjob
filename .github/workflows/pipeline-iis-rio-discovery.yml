name: IIS-Rio discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-trigger
  cancel-in-progress: false

jobs:
  discover-iis-rio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scheduler repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ocr-worker.txt

      - name: Install OCR worker dependencies
        run: pip install -r requirements-ocr-worker.txt

      - name: Run IIS-Rio discovery, download, OCR, and submission
        run: python scripts/discover_iis_rio_candidates.py
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          IIS_RIO_MIN_NOTICE_YEAR: "2026"
          IIS_RIO_MAX_CANDIDATES_PER_RUN: "50"
          IIS_RIO_MAX_DETAILS_PER_RUN: "30"
          IIS_RIO_FETCH_MAX_ATTEMPTS: "3"
          IIS_RIO_FETCH_BACKOFF_SECONDS: "2"
          IIS_RIO_FETCH_TIMEOUT_SECONDS: "30"
          SCRAPE_MAX_PDF_BYTES: "15000000"
          SCRAPE_MAX_PDFS_PER_RUN: "5"
          KREUZBERG_PADDLE_LANGUAGE: "latin"
          KREUZBERG_PADDLE_MODEL_TIER: "tiny"
          KREUZBERG_USE_GPU: "false"
          KREUZBERG_FORCE_OCR_DEFAULT: "false"
          KREUZBERG_EXTRACTION_TIMEOUT_SECONDS: "300"
          FLAGS_use_mkldnn: "0"
          PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "0"
