# Live A catalog parity gate.
#
# Compares the reviewed pinned A-manifest export (config/source_catalog_contract.json)
# against the execution registry offline, then against the live authenticated
# Repo A catalog export (GET /api/pipeline/source-schedule/catalog) with exact
# pin-vs-live equality. Fails closed on identity/lifecycle/cadence/run-timeout
# drift, aggregate capacity != 3, auth/network failures, malformed bodies, and
# pins older than 14 days. Uploads the observed live catalog as the
# catalog-observation.json artifact (7-day retention) for the evidence record.
#
# Requires repository secrets: RENDER_APP_URL, PIPELINE_SECRET.
# Paused registry entries are local execution holds, reported as not covered;
# this workflow never authorizes activation or dispatches ingestion.
#
# Runbook: docs/OPERATIONS.md ("Catalog parity: pinned/live CI") and the
# weekly pin-refresh procedure there. Unit coverage (offline, mocked HTTP):
# tests/test_source_catalog_parity.py.
name: Live A catalog parity

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-catalog-parity
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install requests==2.32.4
      - name: Compare pinned manifest, execution registry and live catalog
        run: python scripts/check_source_catalog_parity.py --live --output catalog-observation.json
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: catalog-parity-${{ github.run_id }}
          path: catalog-observation.json
          retention-days: 7
          if-no-files-found: ignore
