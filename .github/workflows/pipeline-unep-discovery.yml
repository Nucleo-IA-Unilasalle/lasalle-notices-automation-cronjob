name: UNEP discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-unep-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  discover-unep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scheduler repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ocr-worker.txt

      - name: Install OCR worker dependencies
        run: pip install -r requirements-ocr-worker.txt

      - name: Run UNEP discovery, download, OCR, and submission
        run: python scripts/run_managed_source.py --source unep scripts/discover_all_candidates.py
        env:
          SOURCES: "unep"
          SOURCE_RUN_REPORTING_ENABLED: ${{ vars.SOURCE_RUN_REPORTING_ENABLED || 'false' }}
          MIN_NOTICE_YEAR: "2026"
          FILTER_POLICY: "default"
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          CLOSED_BETA_SOURCE_ALLOWLIST: ${{ vars.CLOSED_BETA_SOURCE_ALLOWLIST || '' }}
          UNEP_MIN_NOTICE_YEAR: "2026"
          UNEP_MAX_CANDIDATES_PER_RUN: "50"
          UNEP_FETCH_MAX_ATTEMPTS: "3"
          UNEP_FETCH_BACKOFF_SECONDS: "2"
          UNEP_FETCH_TIMEOUT_SECONDS: "30"
          SCRAPE_MAX_PDF_BYTES: "15000000"
          SCRAPE_MAX_PDFS_PER_RUN: "5"
          KREUZBERG_PADDLE_LANGUAGE: "latin"
          KREUZBERG_PADDLE_MODEL_TIER: "tiny"
          KREUZBERG_USE_GPU: "false"
          KREUZBERG_FORCE_OCR_DEFAULT: "false"
          KREUZBERG_EXTRACTION_TIMEOUT_SECONDS: "300"
          FLAGS_use_mkldnn: "0"
          PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "0"
