name: FAPERGS discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-trigger
  cancel-in-progress: false

jobs:
  discover-fapergs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scheduler repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ocr-worker.txt

      - name: Install OCR worker dependencies
        run: pip install -r requirements-ocr-worker.txt

      - name: Run FAPERGS discovery, download, OCR, and submission
        run: python scripts/discover_fapergs_candidates.py
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          FAPERGS_MIN_NOTICE_YEAR: "2026"
          FAPERGS_MAX_CANDIDATES_PER_RUN: "50"
          FAPERGS_MAX_DETAILS_PER_RUN: "20"
          FAPERGS_FETCH_MAX_ATTEMPTS: "3"
          FAPERGS_FETCH_BACKOFF_SECONDS: "2"
          FAPERGS_FETCH_TIMEOUT_SECONDS: "30"
          SCRAPE_MAX_PDF_BYTES: "15000000"
          SCRAPE_MAX_PDFS_PER_RUN: "5"
          KREUZBERG_PADDLE_LANGUAGE: "latin"
          KREUZBERG_PADDLE_MODEL_TIER: "tiny"
          KREUZBERG_USE_GPU: "false"
          KREUZBERG_FORCE_OCR_DEFAULT: "false"
          KREUZBERG_EXTRACTION_TIMEOUT_SECONDS: "300"
          FLAGS_use_mkldnn: "0"
          PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "0"
