name: Source freshness monitor (read-only)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-freshness-monitor-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scheduler repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ocr-worker.txt

      - name: Install monitor dependencies
        run: pip install -r requirements-ocr-worker.txt

      - name: Check source freshness (read-only, no ingestion trigger)
        run: python scripts/check_source_freshness.py --stale-minutes 120 --output freshness-report.json
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          MONITOR_READ_ONLY: "true"

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freshness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: freshness-report.json
          if-no-files-found: warn
          retention-days: 14
